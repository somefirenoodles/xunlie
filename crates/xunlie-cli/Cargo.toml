[package]
name = "xunlie-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for compiling and validating Xunlie contracts"
publish = false

[[bin]]
name = "xunlie"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
xunlie-domain = { version = "0.1.0", path = "../xunlie-domain" }
xunlie-engine = { version = "0.1.0", path = "../xunlie-engine" }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.21.0"
xunlie-testkit = { version = "0.1.0", path = "../xunlie-testkit" }

[lints]
workspace = true
